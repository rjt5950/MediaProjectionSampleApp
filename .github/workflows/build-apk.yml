name: Android CI

on:
  push:
    branches: 
    - main
    - capture-without-consent
  pull_request:
    branches:
      - main
      - capture-without-consent

jobs:
  build:
  
    name: Build Debug APK
    runs-on: [ code-linux, code-default ]

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: code-actions/android-actions-setup-android@v3

    - name: Install Android SDK Platform 36 and Build Tools 36
      run: |
        sdkmanager --update
        sdkmanager "platforms;android-36" "build-tools;36.0.0"

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug
      
    - name: Get app info (name, versionCode, versionName)
      id: app_info
      run: |
        APP_NAME=$(grep 'name="app_name"' app/src/main/res/values/strings.xml | sed 's/.*>\(.*\)<\/string>.*/\1/')
        VERSION_CODE=$(grep 'versionCode' app/build.gradle | head -1 | sed 's/.*versionCode\s*\([0-9]*\).*/\1/')
        VERSION_NAME=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*versionName\s*"\([^"]*\)".*/\1/')
        
        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        
    - name: Rename APK
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
        NEW_NAME="${{ steps.app_info.outputs.app_name }}_debug_${{ steps.app_info.outputs.version_code }}_${{ steps.app_info.outputs.version_name }}.apk"
        mv "$APK_PATH" "app/build/outputs/apk/debug/$NEW_NAME"
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*_debug_*.apk
        retention-days: 30
